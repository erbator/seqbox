# font_family      family="Terminess Nerd Font Mono" style=Bold
# bold_font        auto
# italic_font      auto
# bold_italic_font auto
font_size        12


# BEGIN_KITTY_FONTS
font_family      family="Terminess Nerd Font Mono" style=Bold
bold_font        family="Terminess Nerd Font Mono" style=Bold
italic_font      family="Terminess Nerd Font Mono" style=Bold
bold_italic_font family="Terminess Nerd Font Mono" style=Bold
disable_ligatures never
# END_KITTY_FONTS

# Window
copy_on_select clipboard
hide_window_decorations   yes
confirm_os_window_close   0
copy_on_select            clipboard

# top right bottom left

# animated cursor trail (replaces smear-cursor.nvim)
cursor_trail 3
cursor_trail_decay 0.1 0.4

# swapped by ~/.config/rumda/scripts/theme.sh
include current-theme.conf
